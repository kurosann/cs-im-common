syntax = "proto3";
package system;
option go_package = "vane-common/v1/pilot/system";

message RunTaskReq {
    string task_code = 1;
    bytes payload   = 2;
}

message RunTaskResp {
    bytes result = 1;
    string task_id = 2;
}

message QueryTaskReq {
    string task_id = 1;
}

enum TaskStatus {
    TaskStatusUnknown     = 0;
	TaskStatusPending     = 1;
	TaskStatusRunning     = 2;
	TaskStatusCompleted   = 3;
	TaskStatusRollingBack = 5;
	TaskStatusRolledBack  = 6;
	TaskStatusFailed      = 7;
	TaskStatusTimeout     = 8;
	TaskStatusCanceled    = 9;
}


message QueryTaskResp {
    TaskStatus status = 1;
    int64 order = 2;
    string step_name = 3;
    string task_id = 4;
    string step_id = 5;
    int64 process_position = 6;
    string err = 7;
    bytes payload = 8;
    bytes result = 9;
}

service TaskService {
    rpc RunTask(RunTaskReq) returns (RunTaskResp);
    rpc QueryTask(QueryTaskReq) returns (QueryTaskResp);
}