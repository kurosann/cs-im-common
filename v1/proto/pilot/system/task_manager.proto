syntax = "proto3";
package system;
option go_package = "vane-common/v1/pilot/system";

// TaskReport 任务报告
message TaskReport {
    string task_id = 1;
    string task_code = 2;
    string status = 3;
    string message = 4;
    int32 process_position = 5;           // 任务整体进度 0-100
    string running_step_name = 6;         // 正在执行的步骤编码
    string error = 7;                     // 错误信息
    bytes context = 8;                    // 任务执行上下文（JSON 序列化）
    bytes payload = 9;                    // 任务原始载荷
    bytes result = 10;                    // 任务执行结果
}

// StepReport 步骤报告
message StepReport {
    string task_id = 1;
    string step_name = 2;
    string status = 3;
    string message = 4;
    bytes payload = 5;
    bytes result = 6;
    string err = 7;
    int64 poll_step_interval = 8;         // 轮询间隔（毫秒）
    int32 process_position = 9;           // 步骤进度 0-100
    bytes context = 10;                   // 任务执行上下文（JSON 序列化）
    bytes pre_step_result = 11;           // 上一步骤的结果
}

// TaskDataReq 获取任务数据请求
message TaskDataReq {
    string task_id = 1;
}

// TaskDataResp 任务数据响应
message TaskDataResp {
    string task_id = 1;
    string task_code = 2;
    string status = 3;
    string message = 4;
    bytes payload = 5;
    repeated StepData steps = 6;
    bytes context = 7;              // 任务执行上下文（JSON 序列化）
    string running_step_name = 8;   // 正在执行的步骤编码
    int64 expired_at = 9;           // 任务过期时间（Unix 时间戳秒数）
}

// StepData 步骤数据
message StepData {
    string name = 1;
    string status = 2;
    string message = 3;
    bytes payload = 4;
    bytes result = 5;
    string err = 6;
    int64 poll_step_interval = 7;   // 轮询间隔（毫秒）
    int32 process_position = 8;     // 步骤进度 0-100
    bytes pre_step_result = 9;      // 上一步骤的结果
}

// CanRunTaskReq 检查任务是否可运行请求
message CanRunTaskReq {
    string task_id = 1;
}

// CanRunTaskResp 检查任务是否可运行响应（空响应，通过 error 判断）
message CanRunTaskResp {
}

// WatchTaskReq 监听任务请求（空请求）
message WatchTaskReq {
}

// ListenTaskReq 拉取任务列表请求（空请求）
message ListenTaskReq {
}

// ListenTaskResp 拉取任务列表响应
message ListenTaskResp {
    repeated TaskDataReq tasks = 1;
}

service TaskManagerService {
    // 上报任务信息
    rpc ReportTaskInfo(TaskReport) returns (TaskReport);
    // 上报步骤信息
    rpc ReportStepInfo(StepReport) returns (StepReport);
    // 获取任务步骤信息
    rpc GetTaskStepInfo(TaskDataReq) returns (TaskDataResp);
    // 监听任务（流式）
    rpc WatchTask(WatchTaskReq) returns (stream TaskDataReq);
    // 拉取任务列表
    rpc ListenTask(ListenTaskReq) returns (ListenTaskResp);
    // 检查是否可以运行任务
    rpc CanRunTask(CanRunTaskReq) returns (CanRunTaskResp);
}
