syntax = "proto3";
package system;
option go_package = "vane-common/v1/pilot/system";

import "google/protobuf/empty.proto";

message ServiceInfo {
    string service_name = 1; // 服务名称
    string service_id = 2; // 服务id
    string service_endpoint = 3; // 服务端口
    string telemetry_endpoint = 4; // 遥测端口
    string service_vip_endpoint = 5; // 服务vip端口
    string replication_role = 6; // 复制角色  master/slave
    string node_role = 7; // 节点角色 control/worker/service
}

message ServiceList {
    repeated ServiceInfo services = 1;
}

enum ServiceAction {
    SERVICE_ACTION_ADD = 0; // 添加服务
    SERVICE_ACTION_UPDATE = 1; // 更新服务
    SERVICE_ACTION_DELETE = 2; // 删除服务
}

message ServiceActionInfo {
    ServiceAction action = 1; // 服务动作
    ServiceInfo service = 2; // 服务信息
}

message ServiceRemoveReq {
    string service_id = 1; // 服务id
}

service DiscoverService {
    // 同步服务信息
    rpc Sync(ServiceInfo) returns (google.protobuf.Empty) {}
    // 获取服务列表
    rpc List(google.protobuf.Empty) returns (ServiceList) {}
    // 监听服务变化
    rpc Watch(google.protobuf.Empty) returns (stream ServiceActionInfo) {}
    // 移除服务
    rpc Remove(ServiceRemoveReq) returns (google.protobuf.Empty) {}
}
