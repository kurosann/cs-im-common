syntax = "proto3";
package public;
option go_package = "vane-common/v1/pilot/public";

message AccLoginReq {
  string accName =1;
  string accPwd =2;
  int64 pid = 3;
  string pub_key =4; // 客户端通信公钥
  string device_code =5; // 设备码
  int64 ts =6;
  string nonce =7;
}

message LoginRes {
  string pub_key = 1;  // 通信公钥
  string token = 2;  // 持续通信的 token
  int64 ts = 3;
}

message PublicServerReq {
  int64  pid = 1;
  string device_code =2; // 设备码
  int64  ts =3;
  string nonce =4;
}

message PublicServerRes {
  string msg = 1;
  int64  ts = 2;
  string nonce =3;
  int64 a =4;
}

message PublicTranslateReq {
  string text = 1;
  string source_lang = 2;
  string target_lang = 3;
}

message PublicTranslateRes {
  string text = 1;
  string provider = 2;
  string model = 3;
  string raw_finish_reason = 4;
}

// 通用请求
message NoticeMsgReq {
  string method =1;
  string payload =2;
  int64 ts = 3; // 时间
  string nonce = 4; // 随机数
}

message NoticeMsgRes {
  string msg=1;    // 加密信息
  int64  ts=2;     // 时间
  string nonce=3;  // 随机数
  int64 a =4;
}
