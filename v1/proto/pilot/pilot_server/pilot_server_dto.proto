syntax = "proto3";
package pilot_server;
option go_package = "vane-common/v1/pilot/pilot_server";

message AccLoginOutReq {
  int64 ts =1; //  时间
  string nonce =2; // 随机数
  string sign =3;
}

message AccLoginOutRes {
  string msg = 1;  // 通信公钥
  int64 ts = 2;
}

message TokenExtendedReq {
  string msg =1;
  int64 ts =2;
  string nonce =3;
  string sign =4;
}

message TokenExtendedRes {
  string msg =1; // 信息
  int64 ts =2;   // 时间
}

message AndroidVersionReq {
  string msg =1;
  int64 ts =2;
  string nonce =3;
}

message AndroidVersionRes {
    string msg =1;
    int64 ts =2;
}

// 账号产品操作
message AccountProdOptReq {
  string msg =1;
  int64 ts =2;
  int64 nonce =3;
}

// 账号产品操作
message AccountProdOptRes {
  string msg =1;
  int64 ts =2;
}

// 账号产品操作
message ServerIpReq {
  string pubkey =1;
  int64 ts =2;
}
// 账号产品操作
message ServerIpRes {
  string msg =1;
  int64 ts =2;
}

message PingReq {
  string msg=1;    // 加密信息
  int64  ts=2;     // 时间
  string nonce=3;   // 随机数
  string sign=4;  // 签名数据
}

message PingRes {
  string msg = 1; // 加密信息
  int64 ts = 2; // 时间
  string nonce = 3; // 随机数
}

// 通用请求
message MsgReq {
  string method =1;
  string payload =2;
  int64 ts = 3; // 时间
  string nonce = 4; // 随机数
  string sign=5;   // 签名数据
}

message MsgRes {
  string msg=1;    // 加密信息
  int64  ts=2;     // 时间
  string nonce=3;  // 随机数
}