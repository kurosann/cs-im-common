syntax = "proto3";
package oplog;
option go_package = "vane-common/oplog/proto";
import "google/protobuf/timestamp.proto";

// 日志类型
enum OplogType {
    OPLG_TYPE_EVENT = 0; // 事件日志
    OPLG_TYPE_ASYNC = 1; // 异步日志
}

// 日志状态
enum OplogStatus {
    OPLG_STATUS_PENDING = 0; // 待执行
    OPLG_STATUS_RUNNING = 1; // 执行中
    OPLG_STATUS_COMPLETED = 2; // 完成
    OPLG_STATUS_FAILED = 3; // 失败
    OPLG_STATUS_CANCELED = 4; // 取消
}

// 日志级别
enum OplogLevel {
    OPLG_LEVEL_INFO = 0; // 信息
    OPLG_LEVEL_WARN = 1; // 警告
    OPLG_LEVEL_ERROR = 2; // 错误
}

message Oplog {
    int64 id = 1;
    string action = 2;
    string action_msg = 3;
    string resource_id = 4;
    string resource_type = 5;
    string resource_name = 6;
    OplogType log_type = 7;
    string role = 8;
    OplogStatus status = 9;
    int32 process_position = 10;
    int64 op_script_id = 11;
    OplogLevel level = 12;
    string cancel_by = 13;
    google.protobuf.Timestamp finish_at = 14;
    string err = 15;
    string trace_id = 16;
}


message RecordOplogReq {
    Oplog oplog = 1;
}

message RecordOplogResp {
    int64 id = 1;
}

message QueryOplogReq {
    int64 id = 1;
}

message QueryOplogResp {
    Oplog oplog = 1;
}
